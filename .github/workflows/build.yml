name: Build

# Every push / PR: build Windows, macOS (universal) and Linux, run the headless
# tests, and upload the plugins as workflow artifacts.
# Pushing a tag like v1.2.3: the same, plus a GitHub Release with zipped builds.
# The in-plugin update checker reads that Release, so tag = version users see.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: -A x64   # default generator = the newest Visual Studio on the runner
          - name: macOS
            os: macos-latest
            cmake_args: -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          - name: Linux
            os: ubuntu-22.04
            cmake_args: -G Ninja -DCMAKE_BUILD_TYPE=Release

    steps:
      - uses: actions/checkout@v7

      - name: Work out version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^set(VO_METER_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      - name: Cache JUCE download
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.cmake_args }} -DVO_METER_VERSION=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          set -e
          ART=build/VOMeter_artefacts/Release
          OUT=dist/VOMeter
          mkdir -p "$OUT"
          cp -R "$ART/VST3/VOMeter.vst3" "$OUT/"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp -R "$ART/AU/VOMeter.component" "$OUT/"
            # Ad-hoc sign so Apple Silicon hosts will load it (not notarised).
            codesign --force --deep --sign - "$OUT/VOMeter.vst3"
            codesign --force --deep --sign - "$OUT/VOMeter.component"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp scripts/install.ps1 "$OUT/"
          else
            cp scripts/install.sh "$OUT/"
            chmod +x "$OUT/install.sh"
          fi
          cp README.md LICENSE "$OUT/"
          cd dist
          ZIP="VOMeter-${{ steps.version.outputs.version }}-${{ matrix.name }}.zip"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "$ZIP" VOMeter > /dev/null
          else
            # -y keeps the symlinks inside macOS bundles intact.
            zip -qry "$ZIP" VOMeter
          fi
          echo "ZIP=dist/$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: VOMeter-${{ matrix.name }}
          path: ${{ env.ZIP }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip scripts/install.sh scripts/install.ps1 \
            --title "VOMeter $GITHUB_REF_NAME" --generate-notes
